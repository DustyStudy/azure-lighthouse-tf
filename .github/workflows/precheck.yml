name: Precheck

on:
  pull_request:
    branches: [main]

# Least-privilege default. Individual jobs elevate only what they need.
permissions:
  contents: read

concurrency:
  group: precheck-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: fmt / validate / lint / security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 - verified SHA

      - uses: hashicorp/setup-terraform@v3.1.2 # TODO: Dependabot will PR the verified SHA for this
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - name: tflint
        uses: terraform-linters/setup-tflint@v4.1.1 # TODO: Dependabot will PR the verified SHA for this
      - run: tflint --init && tflint -f compact

      - name: checkov (Terraform static security scan)
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0 - verified SHA
        with:
          directory: .
          framework: terraform
          quiet: true
          output_format: cli

  precheck-scripts:
    name: custom Lighthouse prechecks
    runs-on: ubuntu-latest
    needs: static-analysis
    strategy:
      matrix:
        cloud: [public, gov]
    # This template ships with no real Azure subscription behind it. Each
    # team that adopts this template adds its own App Registration + OIDC
    # federated credential and sets these repo variables; until then, this
    # job (and everything downstream of it) skips cleanly rather than
    # failing, so the template's code-quality checks still pass on a fresh
    # clone. See README.md "One-time setup" for what an adopting team does.
    if: ${{ vars[format('AZURE_CLIENT_ID_{0}', matrix.cloud)] != '' }}
    permissions:
      contents: read
      id-token: write   # required for azure/login OIDC
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 - verified SHA

      - name: Azure login (OIDC, read-only precheck)
        uses: azure/login@v2.3.0 # TODO: Dependabot will PR the verified SHA for this
        with:
          client-id: ${{ vars[format('AZURE_CLIENT_ID_{0}', matrix.cloud)] }}
          tenant-id: ${{ vars[format('AZURE_TENANT_ID_{0}', matrix.cloud)] }}
          subscription-id: ${{ vars[format('AZURE_SUBSCRIPTION_ID_{0}', matrix.cloud)] }}
          environment: ${{ matrix.cloud == 'gov' && 'AzureUSGovernment' || 'AzureCloud' }}

      - name: Validate principal IDs
        run: |
          chmod +x scripts/prechecks/validate-principal-ids.sh
          ./scripts/prechecks/validate-principal-ids.sh environments/${{ matrix.cloud }}/terraform.tfvars

      - name: Validate role definitions
        run: |
          chmod +x scripts/prechecks/validate-role-defs.sh
          ./scripts/prechecks/validate-role-defs.sh environments/${{ matrix.cloud }}/terraform.tfvars

  no-azure-config:
    name: Azure not configured (template mode)
    runs-on: ubuntu-latest
    needs: static-analysis
    strategy:
      matrix:
        cloud: [public, gov]
    if: ${{ vars[format('AZURE_CLIENT_ID_{0}', matrix.cloud)] == '' }}
    steps:
      - run: |
          echo "::notice::No AZURE_CLIENT_ID_${{ matrix.cloud }} repo variable set - skipping Azure-dependent checks for ${{ matrix.cloud }}."
          echo "::notice::This is expected for an unconfigured clone of the template. See README.md 'One-time setup' to wire up a real subscription."

  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    needs: precheck-scripts
    strategy:
      matrix:
        cloud: [public, gov]
    permissions:
      contents: read
      id-token: write
      pull-requests: write   # to comment plan output on the PR
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 - verified SHA

      - uses: hashicorp/setup-terraform@v3.1.2 # TODO: Dependabot will PR the verified SHA for this
        with:
          terraform_version: "1.9.0"

      - name: Azure login (OIDC)
        uses: azure/login@v2.3.0 # TODO: Dependabot will PR the verified SHA for this
        with:
          client-id: ${{ vars[format('AZURE_CLIENT_ID_{0}', matrix.cloud)] }}
          tenant-id: ${{ vars[format('AZURE_TENANT_ID_{0}', matrix.cloud)] }}
          subscription-id: ${{ vars[format('AZURE_SUBSCRIPTION_ID_{0}', matrix.cloud)] }}
          environment: ${{ matrix.cloud == 'gov' && 'AzureUSGovernment' || 'AzureCloud' }}

      - name: terraform init
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
        run: terraform init -backend-config=backend-config/${{ matrix.cloud }}.backend.hcl

      - name: terraform plan
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
        run: |
          terraform plan \
            -var-file=environments/${{ matrix.cloud }}/terraform.tfvars \
            -out=tfplan-${{ matrix.cloud }}
          terraform show -json tfplan-${{ matrix.cloud }} > plan-${{ matrix.cloud }}.json

      - name: Check for destructive changes to existing delegations
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'lighthouse-destructive-override') }}
        run: |
          chmod +x scripts/prechecks/check-existing-delegation.sh
          ./scripts/prechecks/check-existing-delegation.sh plan-${{ matrix.cloud }}.json

      - name: Note destructive-change override in use
        if: ${{ contains(github.event.pull_request.labels.*.name, 'lighthouse-destructive-override') }}
        run: echo "::warning::'lighthouse-destructive-override' label present - skipping destructive-change gate. This PR needs extra reviewer scrutiny."

      - uses: actions/upload-artifact@v4.6.2 # TODO: Dependabot will PR the verified SHA for this
        with:
          name: tfplan-${{ matrix.cloud }}
          path: tfplan-${{ matrix.cloud }}
          retention-days: 5
