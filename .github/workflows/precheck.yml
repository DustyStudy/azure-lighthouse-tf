name: Precheck

on:
  pull_request:
    branches: [main]

# Least-privilege default. Individual jobs elevate only what they need.
permissions:
  contents: read

concurrency:
  group: precheck-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action calls the GitHub API to list PR commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2 - verified SHA
        with:
          fetch-depth: 0   # gitleaks needs full history, not just the merge commit

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0 # TODO: Dependabot will PR the verified SHA for this
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  static-analysis:
    name: fmt / validate / lint / security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2 - verified SHA

      - uses: hashicorp/setup-terraform@v4.0.1 # TODO: Dependabot will PR the verified SHA for this
        with:
          terraform_version: "1.9.0"
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - name: terraform test
        run: terraform test

      - name: tflint
        uses: terraform-linters/setup-tflint@v6.3.1 # TODO: Dependabot will PR the verified SHA for this
      - run: tflint --init && tflint -f compact

      - name: checkov (Terraform static security scan)
        uses: bridgecrewio/checkov-action@f967808197a8d784d3e72919f38c3ff0cda7884e # v12.1347.0 - verified SHA
        with:
          directory: .
          framework: terraform
          quiet: true
          output_format: cli

  precheck-scripts:
    name: custom Lighthouse prechecks
    runs-on: ubuntu-latest
    needs: static-analysis
    strategy:
      matrix:
        cloud: [public, gov]
    # This template ships with no real Azure subscription behind it. Each
    # team that adopts this template adds its own App Registration + OIDC
    # federated credential and sets these repo variables; until then, this
    # step (and everything downstream of it) skips cleanly rather than
    # failing, so the template's code-quality checks still pass on a fresh
    # clone. See README.md "One-time setup" for what an adopting team does.
    permissions:
      contents: read
      id-token: write   # required for azure/login OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2 - verified SHA

      # NOTE: the `matrix` context is not available in a job-level `if:` -
      # only in step-level `if:` (confirmed GitHub Actions platform
      # behavior, not a bug). So each step below guards itself instead of
      # gating the whole job - this is what lets an unconfigured template
      # clone skip Azure-dependent work per-cloud without failing.
      - name: Check Azure config for ${{ matrix.cloud }}
        id: config
        run: |
          if [ -n "${{ vars[format('AZURE_CLIENT_ID_{0}', matrix.cloud)] }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No AZURE_CLIENT_ID_${{ matrix.cloud }} repo variable set - skipping Azure-dependent checks for ${{ matrix.cloud }}. Expected on an unconfigured template clone; see README.md 'Adopting this template'."
          fi

      - name: Azure login (OIDC, read-only precheck)
        if: steps.config.outputs.configured == 'true'
        uses: azure/login@v3.0.2 # TODO: Dependabot will PR the verified SHA for this
        with:
          client-id: ${{ vars[format('AZURE_CLIENT_ID_{0}', matrix.cloud)] }}
          tenant-id: ${{ vars[format('AZURE_TENANT_ID_{0}', matrix.cloud)] }}
          subscription-id: ${{ vars[format('AZURE_SUBSCRIPTION_ID_{0}', matrix.cloud)] }}
          environment: ${{ matrix.cloud == 'gov' && 'AzureUSGovernment' || 'AzureCloud' }}

      - name: Validate principal IDs
        if: steps.config.outputs.configured == 'true'
        run: |
          chmod +x scripts/prechecks/validate-principal-ids.sh
          ./scripts/prechecks/validate-principal-ids.sh environments/${{ matrix.cloud }}/terraform.tfvars

      - name: Validate role definitions
        if: steps.config.outputs.configured == 'true'
        run: |
          chmod +x scripts/prechecks/validate-role-defs.sh
          ./scripts/prechecks/validate-role-defs.sh environments/${{ matrix.cloud }}/terraform.tfvars


  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    needs: precheck-scripts
    strategy:
      matrix:
        cloud: [public, gov]
    permissions:
      contents: read
      id-token: write
      pull-requests: write   # to comment plan output on the PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2 - verified SHA

      - name: Check Azure config for ${{ matrix.cloud }}
        id: config
        run: |
          if [ -n "${{ vars[format('AZURE_CLIENT_ID_{0}', matrix.cloud)] }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No AZURE_CLIENT_ID_${{ matrix.cloud }} repo variable set - skipping plan for ${{ matrix.cloud }}."
          fi

      - uses: hashicorp/setup-terraform@v4.0.1 # TODO: Dependabot will PR the verified SHA for this
        if: steps.config.outputs.configured == 'true'
        with:
          terraform_version: "1.9.0"

      - name: Azure login (OIDC)
        if: steps.config.outputs.configured == 'true'
        uses: azure/login@v3.0.2 # TODO: Dependabot will PR the verified SHA for this
        with:
          client-id: ${{ vars[format('AZURE_CLIENT_ID_{0}', matrix.cloud)] }}
          tenant-id: ${{ vars[format('AZURE_TENANT_ID_{0}', matrix.cloud)] }}
          subscription-id: ${{ vars[format('AZURE_SUBSCRIPTION_ID_{0}', matrix.cloud)] }}
          environment: ${{ matrix.cloud == 'gov' && 'AzureUSGovernment' || 'AzureCloud' }}

      - name: terraform init
        if: steps.config.outputs.configured == 'true'
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
        run: terraform init -backend-config=backend-config/${{ matrix.cloud }}.backend.hcl

      - name: terraform plan
        if: steps.config.outputs.configured == 'true'
        env:
          ARM_USE_OIDC: "true"
          ARM_USE_AZUREAD: "true"
        run: |
          terraform plan \
            -var-file=environments/${{ matrix.cloud }}/terraform.tfvars \
            -out=tfplan-${{ matrix.cloud }}
          terraform show -json tfplan-${{ matrix.cloud }} > plan-${{ matrix.cloud }}.json

      - name: Check for destructive changes to existing delegations
        if: ${{ steps.config.outputs.configured == 'true' && !contains(github.event.pull_request.labels.*.name, 'lighthouse-destructive-override') }}
        run: |
          chmod +x scripts/prechecks/check-existing-delegation.sh
          ./scripts/prechecks/check-existing-delegation.sh plan-${{ matrix.cloud }}.json

      - name: Note destructive-change override in use
        if: ${{ steps.config.outputs.configured == 'true' && contains(github.event.pull_request.labels.*.name, 'lighthouse-destructive-override') }}
        run: echo "::warning::'lighthouse-destructive-override' label present - skipping destructive-change gate. This PR needs extra reviewer scrutiny."

      - uses: actions/upload-artifact@v7.0.1 # TODO: Dependabot will PR the verified SHA for this
        if: steps.config.outputs.configured == 'true'
        with:
          name: tfplan-${{ matrix.cloud }}
          path: tfplan-${{ matrix.cloud }}
          retention-days: 5
