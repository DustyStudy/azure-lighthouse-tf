name: Deploy - Azure Public

on:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "environments/public/**"
      - "backend-config/public.backend.hcl"
      - "main.tf"
      - "variables.tf"
      - "providers.tf"
      - "outputs.tf"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required so the caller can grant it down to deploy.yml's apply job

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      cloud: public
      environment_name: public-prod
    secrets: inherit
